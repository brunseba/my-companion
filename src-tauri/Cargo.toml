[package]
name = "my-companion"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.1.6"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
aws-config = "1.10.1"
aws-sdk-sts = "1.110.0"
aws-credential-types = "1.3.0"
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tauri-plugin-dialog = "2.7.2"
tiny_http = "0.12.0"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
url = "2.5.8"
tokio = { version = "1.53.1", features = ["rt"] }
sysinfo = "0.39.6"

