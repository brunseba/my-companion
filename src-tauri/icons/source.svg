<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7fe8" />
      <stop offset="1" stop-color="#2a3d99" />
    </linearGradient>
  </defs>
  <!-- Full-bleed square, no corner rounding: macOS applies its own squircle
       mask on top of this at render time. Pre-rounding here would double-round. -->
  <rect width="100" height="100" fill="url(#plate)" />
  <path
    d="M 27 66 A 34 34 0 0 1 73 34"
    fill="none"
    stroke="#fbfbff"
    stroke-opacity="0.4"
    stroke-width="3"
    stroke-linecap="round"
  />
  <circle cx="27" cy="66" r="10.5" fill="#fbfbff" />
  <circle cx="52" cy="47" r="8" fill="#fbfbff" fill-opacity="0.92" />
  <circle cx="73" cy="34" r="6" fill="#fbfbff" fill-opacity="0.85" />
</svg>
