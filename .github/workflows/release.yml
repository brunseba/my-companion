name: Release

# Fires when `npm run release` (commit-and-tag-version) has been run locally
# and the resulting tag pushed - e.g. `git push --follow-tags origin main`.
# Builds the macOS .app/.dmg and publishes them to a GitHub Release for that
# tag, with release notes pulled straight from the matching CHANGELOG.md
# section (see scripts/changelog-section.sh) - no manual `gh release create`
# needed after this.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.2)"
        required: true

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract release notes
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          {
            echo "body<<RELEASE_NOTES_EOF"
            ./scripts/changelog-section.sh "$version"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
